<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 2 - Генератор паролів</title>
</head>
<body>
  <script>
    function* passwordGenerator() {
      let password = "";
      while (true) {
        let char = yield password; // Приймаємо значення через next()
        if (char === 'done') {
          return password; // Завершуємо генератор і повертаємо пароль
        }
        password += char;
      }
    }

    const passGen = passwordGenerator();
    passGen.next(); // Ініціалізуємо генератор

    let isDone = false;
    while (!isDone) {
      let input = prompt("Введіть наступний символ пароля (або 'done' для завершення):");
      
      if (input === 'done') {
        let finalPassword = passGen.next('done').value;
        alert(`Ваш згенерований пароль: ${finalPassword}`);
        isDone = true;
      } else {
        passGen.next(input);
      }
    }
  </script>
</body>
</html>
